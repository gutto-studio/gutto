<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="theme.css" />
  <style>
    /* 「她的手账」v3（v43.13 对照 DeepSeek 设计稿重塑，主人 QA「还是不够干净」）：
       左侧竖排导航 + 白卡浮于暖玫纸 + 页头大标题 + 行间留白替代细线 + CSS 开关。
       干净五源：①侧栏导航不挤内容 ②表面对比分组（卡阴影非描边）③display 页头
       ④行间距呼吸 ⑤原生 checkbox 退役。令牌全在 theme.css（护栏看守零裸写）。 */
    html, body { margin: 0; padding: 0; background: var(--lt-bg);
                 font-family: var(--font-stack); color: var(--lt-ink); height: 100%; }
    .wrap { display: flex; height: 100vh; }

    /* ── 侧边栏导航 ── */
    .side { width: 164px; flex: none; padding: var(--sp-4) var(--sp-2);
            background: var(--lt-card); display: flex; flex-direction: column; gap: 2px; }
    .side .brand { font-size: var(--fs-title); font-weight: 600; color: var(--pink-text);
                   padding: 2px 10px 14px; }
    .side button { display: flex; align-items: center; gap: 10px; border: none;
                   background: transparent; color: var(--lt-secondary);
                   font-size: var(--fs-body); padding: 8px 10px;
                   border-radius: var(--r-chip); cursor: pointer; text-align: left; }
    .side button svg { width: 16px; height: 16px; flex: none; }
    .side button:hover { color: var(--lt-ink); background: var(--lt-fill); }
    .side button.on { background: var(--pink-soft); color: var(--pink-deep); font-weight: 600; }

    /* ── 内容区 ── */
    .content { flex: 1; min-width: 0; padding: var(--sp-4) var(--sp-6);
               overflow-y: auto; box-sizing: border-box; }
    .page { display: none; }
    .page.on { display: block; }
    .page-head { display: flex; align-items: baseline; gap: var(--sp-2);
                 margin: 2px 0 var(--sp-4); }
    .page-head h2 { font-size: var(--fs-display); font-weight: 600; margin: 0; }
    .page-head .sp { flex: 1; }

    /* ── 卡片：表面对比分组（阴影非描边）── */
    .card { background: var(--lt-card); border-radius: var(--r-card);
            box-shadow: var(--shadow-card); padding: 6px var(--sp-4) 8px;
            margin-bottom: var(--sp-4); }
    /* .card h3 死规则已删（审稿打磨：全窗零 <h3>，卡片头走 .card-head） */
    .card-head { display: flex; align-items: center; gap: 6px; margin: 10px 0 2px;
                 font-size: var(--fs-body); font-weight: 600; min-height: 22px; }
    .card-head .sp { flex: 1; }
    .info { width: 15px; height: 15px; border-radius: 50%; border: 1px solid var(--lt-hairline);
            color: var(--lt-secondary); font-size: var(--fs-micro); font-style: italic; font-weight: 600;
            display: inline-flex; align-items: center; justify-content: center;
            cursor: help; flex: none; }

    /* 状态概览：卡内三列，留白分列（无内框线） */
    .overview[hidden] { display: none; }   /* 作者规则让位：hidden 必须真隐藏 */
    .overview { display: flex; gap: var(--sp-6); padding: 12px var(--sp-4) 6px;
                background: var(--lt-card); border-radius: var(--r-card);
                box-shadow: var(--shadow-card); margin-bottom: var(--sp-4); }
    .overview .cell { flex: 1; min-width: 0; }
    .overview .k { font-size: var(--fs-meta); color: var(--lt-secondary); margin-bottom: 2px; }
    .overview .v { font-size: var(--fs-body); font-weight: 500;
                   overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* 行式条目：留白分行（hairline 退役） */
    .item { display: flex; align-items: center; gap: var(--sp-2); padding: 11px 0; }
    .item .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--lt-hairline); flex: none; }
    .item.active .dot { background: var(--pink-text); }
    .item .txt { flex: 1; min-width: 0; }
    .item .main { font-size: var(--fs-body); }
    .item.active .main { color: var(--pink-text); font-weight: 600; }
    .item .sub { font-size: var(--fs-meta); color: var(--lt-secondary); margin-top: 1px;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item .ops { display: flex; gap: 6px; flex: none; }

    .item-form { padding: var(--sp-2); margin: var(--sp-1) 0 var(--sp-2); background: var(--lt-fill);
                 border-radius: var(--r-chip); }
    .frow { display: flex; gap: var(--sp-2); align-items: center; margin-bottom: 6px; }
    .frow:last-child { margin-bottom: 0; }
    .frow label { font-size: var(--fs-label); color: var(--lt-secondary); width: 64px; flex: none; }

    .field { flex: 1; min-width: 0; border: 1px solid var(--lt-hairline);
             border-radius: var(--r-chip); background: var(--lt-card);
             padding: 5px 8px; font-size: var(--fs-body); font-family: var(--mono-stack);
             color: var(--lt-ink); transition: border-color var(--dur-fast); }
    .field:focus-visible { outline: none; border-color: var(--focus-ring); }
    .field.pwd { font-family: var(--font-stack); }
    /* 同窗聚焦语言统一（审稿打磨）：.area 与 .field 同款描边交换，不走全局光圈 */
    .area:focus-visible { outline: none; border-color: var(--focus-ring); }
    .area { width: 100%; box-sizing: border-box; min-height: 150px;
            border: 1px solid var(--lt-hairline); border-radius: var(--r-chip);
            background: var(--lt-card); padding: var(--sp-2); resize: vertical;
            font-size: var(--fs-body); font-family: var(--mono-stack); color: var(--lt-ink); }
    .readout { background: var(--lt-fill); border-radius: var(--r-chip);
               padding: var(--sp-2) var(--sp-3); font-size: var(--fs-body);
               line-height: var(--lh-body); white-space: pre-wrap; color: var(--lt-secondary);
               max-height: 140px; overflow-y: auto; }

    /* ── 按钮与胶囊 ── */
    .btn { background: var(--pink-text); color: var(--on-accent); border: none; border-radius: 999px;
           padding: 7px 16px; font-size: var(--fs-body); font-weight: 600; cursor: pointer; }
    .btn:hover { background: var(--pink-deep); }
    .btn:active { transform: translateY(1px); }
    .btn.ghost { background: transparent; color: var(--lt-ink);
                 border: 1px solid var(--lt-hairline); }
    .btn.ghost:hover { background: var(--lt-fill); }
    .btn.sm { padding: 4px 12px; font-size: var(--fs-meta); }
    .btn.danger-ghost { background: transparent; color: var(--danger-fill);
                        border: 1px solid var(--danger-soft); }
    .btn.danger-ghost:hover { background: var(--danger-soft); }
    /* 删除键与保存/取消拉开（审稿打磨）：表单行内推到最右，防手滑连点 */
    .frow .btn.danger-ghost { margin-left: auto; }
    .tag { font-size: var(--fs-micro); border-radius: 999px; padding: 2px 8px;
           background: var(--pink-soft); color: var(--pink-text); font-weight: 600; flex: none; }
    .tag.ok { background: var(--ok-soft); color: var(--ok-fill); }
    .tag.off { background: var(--lt-fill); color: var(--lt-secondary); }
    .chip-btn { border: 1px solid var(--lt-hairline); background: transparent;
                border-radius: 999px; padding: 3px 12px; font-size: var(--fs-meta);
                color: var(--lt-ink); cursor: pointer; }
    .chip-btn:hover { background: var(--lt-fill); }
    .chip-btn:active { transform: translateY(1px); }
    .chip-btn.live { background: var(--pink-soft); color: var(--pink-deep); border-color: transparent; }
    .chip-btn.sel { background: var(--pink-soft); color: var(--pink-deep); border-color: transparent; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .card-acts { margin: var(--sp-1) 0 var(--sp-2); display: flex; gap: var(--sp-2); align-items: center; }
    .status { font-size: var(--fs-meta); color: var(--lt-secondary); line-height: var(--lh-meta); }
    /* v44.16 C-1 羁绊史：里程碑时间线（小标题墨色、条目次级灰、日期不换行） */
    .bh-title { font-size: var(--fs-meta); color: var(--lt-ink); font-weight: 600;
                margin: var(--sp-2) 0 2px; }
    .bh-list { font-size: var(--fs-meta); color: var(--lt-secondary);
               line-height: var(--lh-meta); display: grid; gap: 2px; }
    .bh-list .d { white-space: nowrap; color: var(--pink-text); margin-right: 6px; }
    #plApprovalTimeoutLabel { width: auto; }
    #plApprovalTimeout { max-width: 90px; flex: none; }
    #llmCtx { max-width: 90px; flex: none; text-align: center; }

    /* ── iOS 式开关：原生 checkbox 退役 ── */
    .switch { appearance: none; -webkit-appearance: none; position: relative;
              width: 34px; height: 20px; border-radius: 999px; background: var(--lt-hairline);
              cursor: pointer; flex: none; margin: 0;
              transition: background-color var(--dur-fast); }
    .switch::after { content: ''; position: absolute; top: 2px; left: 2px;
                     width: 16px; height: 16px; border-radius: 50%; background: var(--lt-card);
                     box-shadow: var(--shadow-knob);
                     transition: transform var(--dur-fast) var(--ease-pop); }
    .switch:checked { background: var(--pink-text); }
    .switch:checked::after { transform: translateX(14px); }

    .trow { display: flex; align-items: center; justify-content: space-between;
            padding: 11px 0; font-size: var(--fs-body); }
    /* 标签+ⓘ 归组贴左（v44.9）：ⓘ 不再被 space-between 甩到行中央 */
    .trow .lab { display: flex; align-items: center; gap: 6px; min-width: 0; }

    /* ── 记录页：段控子页签（唯一存留的页签语言）+ 列表 ── */
    .seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--lt-fill);
           border-radius: var(--r-chip); margin-bottom: var(--sp-3); }
    .seg button { border: 1px solid transparent; background: transparent; color: var(--lt-secondary);
                  font-size: var(--fs-meta); padding: 3px 10px; cursor: pointer;
                  border-radius: 5px; }
    .seg button:hover { color: var(--lt-ink); }
    .seg button.on { background: var(--pink-soft); color: var(--pink-deep); font-weight: 600; }
    .subview { display: none; }
    .subview.on { display: block; }
    .msg { text-align: center; color: var(--lt-secondary); font-size: var(--fs-body);
           padding: 48px var(--sp-3); white-space: pre-line; line-height: var(--lh-meta); }
    .day { font-size: var(--fs-label); color: var(--lt-secondary);
           margin: var(--sp-3) 2px var(--sp-2); font-weight: 600; }
    .act { display: flex; gap: var(--sp-2); padding: 7px 2px; }
    .badge { font-size: var(--fs-micro); font-weight: 600; border-radius: 999px;
             padding: 2px 8px; height: fit-content; }
    .badge[data-kind="chat"] { background: var(--pink-soft); color: var(--pink-text); }
    .badge[data-kind="clean"] { background: var(--ok-soft); color: var(--ok-fill); }
    .badge[data-kind="report"] { background: var(--blue-user); color: var(--blue-text); }
    .badge[data-kind="say"] { background: var(--purple-soft); color: var(--purple-text); }
    .badge[data-kind="anim"] { background: var(--amber-soft); color: var(--amber-text); }
    .badge[data-kind="react"] { background: var(--danger-soft); color: var(--danger-deep); }
    .badge[data-kind="system"] { background: var(--lt-fill); color: var(--lt-secondary); }
    .act .txt { font-size: var(--fs-body); line-height: var(--lh-body); }
    .act .when { font-size: var(--fs-micro); color: var(--lt-secondary); }
    .act .grow { flex: 1; min-width: 0; }

    .hrow { margin-bottom: var(--sp-2); }
    .hhead { font-size: var(--fs-meta); margin-bottom: 3px; }
    .hhead .who { font-weight: 600; }
    .hhead.me .who { color: var(--blue-text); }
    .hhead.her .who { color: var(--pink-text); }
    .hhead .when { color: var(--lt-secondary); }
    .hbody { font-size: var(--fs-body); padding: 8px 11px; line-height: var(--lh-body);
             white-space: pre-wrap; word-break: break-word; }
    .me { text-align: right; }
    .me .hbody { background: var(--blue-user); display: inline-block; text-align: left;
                 border-radius: 14px 14px 4px 14px; }
    .her .hbody { background: var(--pink-soft); display: inline-block;
                  border-radius: 14px 14px 14px 4px; }

    .logline { font-family: var(--mono-stack); font-size: var(--fs-micro);
               line-height: 1.7; white-space: pre-wrap; word-break: break-all;
               color: var(--lt-ink); padding: 4px 0; }
    .bar { display: flex; justify-content: flex-end; align-items: center; gap: var(--sp-2);
           padding: var(--sp-2) 0 0; font-size: var(--fs-meta); color: var(--lt-secondary); }

    .cmdlist .cmd { display: flex; gap: var(--sp-2); align-items: baseline; padding: 8px 0; }
    .cmdlist .cname { font-family: var(--mono-stack); color: var(--pink-text);
                      font-weight: 600; white-space: nowrap; font-size: var(--fs-body); }
    .cmd-desc { color: var(--lt-secondary); font-size: var(--fs-meta); }
    .empty-note { color: var(--lt-secondary); font-size: var(--fs-body); padding: var(--sp-2) 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="side" id="seg">
      <div class="brand">gutto</div>
    </nav>

    <div class="content">
      <div class="page" id="page-settings">
        <div class="page-head"><h2 id="ph-settings"></h2><span class="sp"></span></div>
        <div class="overview" id="overview" hidden></div>

        <section class="card">
          <div class="card-head"><span id="llmTitle"></span><span class="info" id="llmInfo">i</span>
            <span class="sp"></span><span class="status" id="provChatStatus"></span></div>
          <div id="provChat"></div>
          <div class="trow"><span id="llmThinkLabel"></span><span class="chips" id="llmThinkChips"></span></div>
          <div class="trow"><span class="lab"><span id="llmCtxLabel"></span><span class="info" id="llmCtxInfo">i</span></span>
            <input id="llmCtx" class="field" type="number" min="0" max="40" placeholder="0" /></div>
          <div class="card-acts">
            <button class="chip-btn" id="provChatAdd"></button>
            <button class="btn sm" id="test"></button>
          </div>
        </section>

        <section class="card">
          <div class="card-head"><span id="plVlTitle"></span><span class="info" id="plVlInfo">i</span>
            <span class="sp"></span><span class="status" id="provVlStatus"></span></div>
          <div id="provVl"></div>
          <div class="card-acts"><button class="chip-btn" id="provVlAdd"></button></div>
        </section>

        <section class="card">
          <div class="card-head"><span id="personaTitle"></span><span class="info" id="personaInfo">i</span>
            <span class="sp"></span><span class="status" id="pStatus"></span></div>
          <textarea id="persona" class="area" spellcheck="false"></textarea>
          <div class="card-acts">
            <button class="btn sm" id="pSave"></button>
            <button class="btn ghost sm" id="pRevert"></button>
            <button class="chip-btn" id="pImport"></button>
          </div>
        </section>

        <section class="card">
          <div class="card-head"><span id="memTitle"></span><span class="sp"></span>
            <span class="status" id="memStats"></span><button class="chip-btn" id="memCompact"></button></div>
          <div class="readout" id="memSummary"></div>
        </section>

        <!-- v44.10 通用：界面语言（GUTTO_LANG，重启壳生效） -->
        <section class="card">
          <div class="card-head"><span id="langTitle"></span><span class="info" id="langInfo">i</span></div>
          <div class="trow"><span id="langLabel"></span><span class="chips" id="langChips"></span></div>
          <div class="status" id="langHint"></div>
        </section>
      </div>

      <div class="page" id="page-play">
        <div class="page-head"><h2 id="ph-play"></h2><span class="sp"></span></div>
        <section class="card">
          <!-- v44.3 羁绊（好感度）：等级/进度/连访——玩法页头牌（情绪主线高于功能组） -->
          <!-- v44.16 C-1 羁绊史：最长连访 + 解锁清单 + 里程碑时间线（数据全在 bond.json） -->
          <div class="card-head"><span id="plBondTitle"></span><span class="info" id="plBondInfo">i</span>
            <span class="sp"></span><button class="btn sm" id="plFeed"></button></div>
          <div class="status" id="plBondStats"></div>
          <div id="plBondHistory" hidden>
            <div class="status" id="plBondBest"></div>
            <div class="chips" id="plBondUnlocks"></div>
            <div class="bh-title" id="plBondHistTitle"></div>
            <div class="bh-list" id="plBondHistList"></div>
          </div>
        </section>

        <section class="card">
          <div class="card-head"><span id="plAnimTitle"></span><span class="info" id="plAnimInfo">i</span>
            <span class="sp"></span><button class="btn sm" id="plAnimTour"></button></div>
          <div class="chips" id="plAnimChips"></div>
          <div class="status" id="plAnimStatusRow"></div>
        </section>

        <section class="card">
          <div class="card-head"><span id="plHooksTitle"></span><span class="info" id="plHooksInfo">i</span>
            <span class="sp"></span><button class="chip-btn" id="plHooksInstall"></button></div>
          <div class="chips" id="plHooksChips"></div>
          <div class="status" id="plHooksStatusRow"></div>
          <div class="trow"><span id="plApprovalLabel"></span><input type="checkbox" class="switch" id="plApproval" /></div>
          <div class="frow">
            <label id="plApprovalTimeoutLabel"></label>
            <input id="plApprovalTimeout" class="field" type="number" min="10" max="110" />
          </div>
        </section>

        <section class="card">
          <div class="card-head"><span id="plSoundTitle"></span><span class="info" id="plSoundInfo">i</span></div>
          <div class="trow"><span id="plSfxLabel"></span><input type="checkbox" class="switch" id="plSfx" /></div>
          <div class="trow"><span id="plVoiceLabel"></span><input type="checkbox" class="switch" id="plVoice" /></div>
        </section>

        <section class="card">
          <div class="card-head"><span id="plCmdTitle"></span><span class="info" id="plCmdInfo">i</span>
            <span class="sp"></span><button class="chip-btn" id="plCmdOpen"></button></div>
          <div id="plCmdList" class="cmdlist"></div>
        </section>
      </div>

      <div class="page" id="page-records">
        <div class="page-head"><h2 id="ph-records"></h2><span class="sp"></span></div>
        <div class="seg" id="recSub"></div>
        <div class="subview" id="rec-activity"><div class="msg" id="actEmpty"></div><div id="actList"></div>
          <div class="bar"><button class="btn ghost sm" id="actRefresh"></button><span id="actCount"></span></div></div>
        <div class="subview" id="rec-history"><div class="msg" id="hisEmpty"></div><div id="hisList"></div>
          <div class="bar"><button class="btn ghost sm" id="hisRefresh"></button><button class="btn danger-ghost sm" id="hisClear"></button><span id="hisCount"></span></div></div>
        <div class="subview" id="rec-log"><div class="msg" id="logEmpty"></div><div id="logList"></div>
          <div class="bar"><button class="btn ghost sm" id="logRefresh"></button><span id="logCount"></span></div></div>
      </div>
    </div>
  </div>
  <script src="../i18n/zh.js"></script>
  <script src="../i18n/en.js"></script>
  <script src="../i18n/ja.js"></script>
  <script src="../i18n/ko.js"></script>
  <script src="../i18n/index.js"></script>
  <script src="icons.js"></script>
  <script src="settings.js"></script>
</body>
</html>
